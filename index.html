// ==================== LOADING ====================
function Loading(props){
  return h('div',{className:'h-full flex items-center justify-center'},

      h(Ic.Spin),

    )

// ==================== TOAST ====================
function useToast(){
  var ref = useState(null);
  var toast = ref[0]; var setToast = ref[1];
  var show = function(msg){ setToast(msg); setTimeout(function(){ setToast(null); }, 3000); };
  var el = toast ? h('div',{className:'fixed top-6 right-6 z-[100] bg-stone-900 text-white px-6 py-3 rounded-xl shadow-2xl font-bold text-xs flex items-center gap-3 anim-up'},
    h('div',{className:'w-2 h-2 bg-green-500 rounded-full pulse-dot'}), toast
  ) : null;
  return [show, el];
}

// ==================== DASHBOARD ====================
function DashboardPage(){
  var ref1 = useState({activeProjects:0,hotLeads:0,totalRevenue:0,pendingCosts:0,totalLeadValue:0});
  var stats = ref1[0]; var setStats = ref1[1];
  var ref2 = useState([]); var recent = ref2[0]; var setRecent = ref2[1];
  var ref3 = useState(true); var loading = ref3[0]; var setLoading = ref3[1];

  useEffect(function(){
    (async function(){
      setLoading(true);
      var r = await Promise.all([
        db.from('leads').select('status,temperature,budget'),
        db.from('projects').select('id,title,client_name,stage,deadline,total_value,paid_value,costs').order('created_at',{ascending:false}).limit(3)
      ]);
      var leads = r[0].data||[]; var projects = r[1].data||[];
      setStats({
        activeProjects: projects.filter(function(p){return p.stage!=='Entrega';}).length,
        hotLeads: leads.filter(function(l){return l.temperature==='hot';}).length,
        totalRevenue: projects.reduce(function(s,p){return s+(Number(p.paid_value)||0);},0),
        pendingCosts: projects.reduce(function(s,p){return s+(Number(p.costs)||0);},0),
        totalLeadValue: leads.reduce(function(s,l){return s+(Number(l.budget)||0);},0),
      });
      setRecent(projects);
      setLoading(false);
    })();
  },[]);

  if(loading) return h(Loading,{text:'Carregando dados...'});

  var chartData = [{name:'Mar',r:9000},{name:'Abr',r:11500},{name:'Mai',r:10200},{name:'Jun',r:13800},{name:'Jul',r:stats.totalRevenue>0?stats.totalRevenue:12000}];

  var kpis = [
    {label:'Projetos Ativos',value:String(stats.activeProjects).padStart(2,'0'),sub:'Em andamento'},
    {label:'Leads Quentes',value:String(stats.hotLeads).padStart(2,'0'),sub:'R$ '+stats.totalLeadValue.toLocaleString('pt-BR')+' em propostas'},
    {label:'Receita Recebida',value:'R$ '+stats.totalRevenue.toLocaleString('pt-BR'),sub:'Total acumulado'},
    {label:'Custos',value:'R$ '+stats.pendingCosts.toLocaleString('pt-BR'),sub:'Total em projetos'},
  ];

  return h('div',{className:'space-y-8 anim-fade pb-10'},
    h('div',{className:'flex justify-between items-end flex-wrap gap-4'},
      h('div',null,
        h('h2',{className:'text-2xl font-serif text-stone-900'},'Visão Geral'),
        h('p',{className:'text-stone-500 text-sm'},'Resumo financeiro e operacional em tempo real.')
      ),
      h('div',{className:'text-right'},
        h('p',{className:'text-xs font-bold text-stone-400 uppercase tracking-widest'},'Propostas em aberto'),
        h('p',{className:'text-xl font-bold text-stone-800'},'R$ '+stats.totalLeadValue.toLocaleString('pt-BR'))
      )
    ),
    h('div',{className:'grid grid-cols-2 lg:grid-cols-4 gap-4'},
      kpis.map(function(k,i){return h('div',{key:i,className:'bg-white p-5 rounded-xl border border-stone-200 shadow-sm'},
        h('p',{className:'text-[10px] font-bold uppercase tracking-wider text-stone-400 mb-2'},k.label),
        h('h3',{className:'text-2xl md:text-3xl font-serif text-stone-800'},k.value),
        h('p',{className:'text-xs text-stone-500 mt-2'},k.sub)
      );})
    ),
    h('div',{className:'bg-white p-6 rounded-xl border border-stone-200 shadow-sm'},
      h('h4',{className:'text-lg font-bold text-stone-800 font-serif mb-6'},'Receita Acumulada'),
      h('div',{className:'h-64'},
        h(ResponsiveContainer,{width:'100%',height:'100%'},
          h(AreaChart,{data:chartData},
            h('defs',null,h('linearGradient',{id:'cR',x1:0,y1:0,x2:0,y2:1},h('stop',{offset:'5%',stopColor:'#1c1917',stopOpacity:.1}),h('stop',{offset:'95%',stopColor:'#1c1917',stopOpacity:0}))),
            h(CartesianGrid,{strokeDasharray:'3 3',vertical:false,stroke:'#f5f5f5'}),
            h(XAxis,{dataKey:'name',stroke:'#a8a29e',fontSize:12,tickLine:false,axisLine:false}),
            h(Tooltip,{contentStyle:{backgroundColor:'#fff',border:'none',borderRadius:'8px',boxShadow:'0 10px 15px rgba(0,0,0,.05)'},formatter:function(v){return ['R$ '+v.toLocaleString('pt-BR'),''];}}),
            h(Area,{type:'monotone',dataKey:'r',stroke:'#1c1917',fillOpacity:1,fill:'url(#cR)',strokeWidth:3})
          )
        )
      )
    )
  );
}

// ==================== CRM ====================
function CRMPage(){
  var ref1=useState([]);var leads=ref1[0];var setLeads=ref1[1];
  var ref2=useState(true);var loading=ref2[0];var setLoading=ref2[1];
  var ref3=useState(false);var saving=ref3[0];var setSaving=ref3[1];
  var ref4=useState(null);var selId=ref4[0];var setSelId=ref4[1];
  var ref5=useState(false);var modal=ref5[0];var setModal=ref5[1];
  var ref6=useState(false);var editing=ref6[0];var setEditing=ref6[1];
  var refT=useToast();var showToast=refT[0];var toastEl=refT[1];
  var ref7=useState({name:'',email:'',phone:'',address:'',notes:'',source:'Instagram',budget:'',temperature:'warm',nextDate:''});
  var form=ref7[0];var setForm=ref7[1];

  var fetchLeads=useCallback(async function(){
    setLoading(true);
    var r=await db.from('leads').select('*').order('created_at',{ascending:false});
    if(!r.error&&r.data) setLeads(r.data);
    setLoading(false);
  },[]);
  useEffect(function(){fetchLeads();},[fetchLeads]);

  var sel=leads.find(function(l){return l.id===selId;});
  var isOD=function(d){if(!d)return false;var t=new Date();t.setHours(0,0,0,0);return new Date(d)<t;};
  var tempCl=function(t){if(t==='hot')return 'bg-red-100 text-red-700';if(t==='cold')return 'bg-blue-100 text-blue-700';return 'bg-amber-100 text-amber-700';};
  var colTotal=function(st){return leads.filter(function(l){return l.status===st;}).reduce(function(s,l){return s+(Number(l.budget)||0);},0);};

  var openNew=function(){setForm({name:'',email:'',phone:'',address:'',notes:'',source:'Instagram',budget:'',temperature:'warm',nextDate:''});setEditing(false);setModal(true);};
  var openEdit=function(){if(!sel)return;setForm({name:sel.name,email:sel.email,phone:sel.phone,address:sel.address||'',notes:sel.notes||'',source:sel.source,budget:String(sel.budget||''),temperature:sel.temperature||'warm',nextDate:sel.next_action_date||''});setEditing(true);setModal(true);};

  var submit=async function(e){
    e.preventDefault();setSaving(true);
    var pay={name:form.name,email:form.email,phone:form.phone,address:form.address,notes:form.notes,source:form.source,budget:Number(form.budget)||0,temperature:form.temperature,next_action_date:form.nextDate||null};
    if(editing&&selId){
      var r=await db.from('leads').update(pay).eq('id',selId).select().single();
      if(r.data)setLeads(function(p){return p.map(function(l){return l.id===selId?r.data:l;});});
      showToast('Lead atualizado!');
    }else{
      var r2=await db.from('leads').insert({...pay,status:'Prospecção'}).select().single();
      if(r2.data){setLeads(function(p){return [r2.data,...p];});showToast('Novo lead cadastrado!');}
    }
    setSaving(false);setModal(false);setEditing(false);
  };

  var moveStatus=async function(id,newSt){
    setLeads(function(p){return p.map(function(l){return l.id===id?{...l,status:newSt}:l;});});
    await db.from('leads').update({status:newSt}).eq('id',id);
    showToast('Lead movido para: '+newSt);
  };

  var deleteLead=async function(id){
    await db.from('leads').delete().eq('id',id);
    setLeads(function(p){return p.filter(function(l){return l.id!==id;});});
    if(selId===id)setSelId(null);
    showToast('Lead removido');
  };

  if(loading) return h(Loading,{text:'Carregando leads...'});

  var inp=function(ph,key,type){return h('input',{placeholder:ph,type:type||'text',value:form[key],onChange:function(e){var o={};o[key]=e.target.value;setForm(Object.assign({},form,o));},className:'w-full p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-stone-900 transition-colors text-sm'});};

  return h('div',{className:'h-full flex flex-col space-y-6 anim-fade relative pb-6'},
    toastEl,
    // Header
    h('div',{className:'flex justify-between items-center px-2 flex-wrap gap-3'},
      h('div',null,
        h('h3',{className:'text-2xl font-bold text-stone-800 font-serif'},'Pipeline Comercial'),
        h('p',{className:'text-sm text-stone-500'},leads.length+' leads · R$ '+leads.reduce(function(s,l){return s+(Number(l.budget)||0);},0).toLocaleString('pt-BR')+' em aberto')
      ),
      h('button',{onClick:openNew,className:'flex items-center gap-2 bg-stone-900 text-white px-5 py-2.5 rounded-xl hover:bg-stone-800 transition-all text-sm font-bold shadow-lg active:scale-95'},h(Ic.Plus),' Novo Lead')
    ),
    // Kanban
    h('div',{className:'flex-1 overflow-x-auto pb-4 flex gap-5 custom-scrollbar min-h-[500px]'},
      LEAD_STATUSES.map(function(st){
        var stLeads=leads.filter(function(l){return l.status===st;});
        return h('div',{key:st,className:'flex-shrink-0 w-72 md:w-80 flex flex-col'},
          h('div',{className:'flex items-center justify-between mb-1 px-2'},
            h('h4',{className:'text-[10px] font-black uppercase tracking-[0.15em] text-stone-500 flex items-center gap-2'},
              h('span',{className:'w-2 h-2 rounded-full bg-stone-300'}),st
            ),
            h('span',{className:'bg-stone-200/60 text-stone-600 text-[9px] font-black px-2.5 py-1 rounded-full'},stLeads.length)
          ),
          h('p',{className:'text-[10px] font-bold text-stone-400 px-2 mb-3'},'R$ '+colTotal(st).toLocaleString('pt-BR')),
          h('div',{className:'flex-1 rounded-2xl p-3 space-y-3 bg-stone-100/30 border border-stone-100'},
            stLeads.map(function(lead){
              var overdue=isOD(lead.next_action_date);
              return h('div',{key:lead.id,onClick:function(){setSelId(lead.id);},className:'bg-white rounded-xl border p-4 shadow-sm hover:shadow-xl transition-all cursor-pointer relative border-l-4 '+(overdue?'border-red-500':'border-stone-200')},
                overdue?h('div',{className:'absolute -top-2 -right-2 bg-red-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-md z-10'},'ATRASADO'):null,
                h('div',{className:'flex justify-between items-start mb-3'},
                  h('h5',{className:'font-bold text-stone-800 text-[14px] leading-tight'},lead.name),
                  h('button',{onClick:function(e){e.stopPropagation();window.open('https://wa.me/55'+String(lead.phone||'').replace(/\D/g,''),'_blank');},className:'text-green-600 p-1 bg-green-50 rounded-full hover:scale-110 transition-transform'},h(Ic.WA))
                ),

        h('h4',{className:'text-[12px] font-black uppercase tracking-widest text-stone-400 mb-6'},'Raio-X Financeiro'),
        h('div',{className:'grid grid-cols-3 gap-4'},
          h('div',null,h('p',{className:'text-xs text-stone-500'},'Valor Total'),h('p',{className:'text-lg font-bold text-stone-900'},'R$ '+Number(sel.total_value||0).toLocaleString('pt-BR'))),
          h('div',null,h('p',{className:'text-xs text-stone-500'},'Recebido'),h('p',{className:'text-lg font-bold text-green-600'},'R$ '+Number(sel.paid_value||0).toLocaleString('pt-BR'))),
          h('div',null,h('p',{className:'text-xs text-stone-500'},'Margem'),h('p',{className:'text-lg font-bold text-stone-900'},margin(sel.total_value||0,sel.costs||0)+'%'))
        )
      )
    ):null
  );
}

// ==================== FINANCE PLACEHOLDER ====================
function FinancePage(){
  return h('div',{className:'flex items-center justify-center h-full'},
    h('div',{className:'text-center text-stone-400'},
      h('p',{className:'text-4xl mb-4'},'💰'),
      h('p',{className:'text-xs font-bold uppercase tracking-widest'},'Módulo Financeiro'),
      h('p',{className:'text-xs mt-2'},'Conectado ao Supabase — pronto para implementar')
    )
  );
}

// ==================== LAYOUT ====================
function Layout(props){
  var ref1=useState(false);var sidebar=ref1[0];var setSidebar=ref1[1];
  var tabs=[
    {id:'dashboard',label:'Início',icon:h(Ic.Dashboard)},
    {id:'crm',label:'CRM',icon:h(Ic.Users)},
    {id:'projects',label:'Projetos',icon:h(Ic.Briefcase)},
    {id:'finance',label:'Financeiro',icon:h(Ic.Dollar)},
  ];

  return h('div',{className:'flex h-screen overflow-hidden bg-stone-50'},
    // Sidebar Desktop
    h('aside',{className:'fixed inset-y-0 left-0 z-50 w-64 bg-stone-950 text-stone-100 flex flex-col transform transition-transform duration-300 lg:relative lg:translate-x-0 '+(sidebar?'translate-x-0':'-translate-x-full')},
      h('div',{className:'p-8 flex items-center justify-between'},
        h('div',null,
          h('h1',{className:'text-xl font-bold tracking-tighter flex items-center gap-1 font-serif'},'SPAZIO',h('span',{className:'text-stone-500 font-light'},'ARQUITETURA')),
          h('p',{className:'text-[9px] uppercase tracking-[0.3em] text-stone-600 mt-1 font-black'},'Elite Management')
        ),
        h('button',{onClick:function(){setSidebar(false);},className:'lg:hidden p-2 text-stone-500 hover:text-white'},h(Ic.X))
      ),
      h('nav',{className:'flex-1 mt-4 px-4 space-y-2'},
        tabs.map(function(t){return h('button',{key:t.id,onClick:function(){props.setTab(t.id);setSidebar(false);},className:'w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-300 '+(props.tab===t.id?'bg-stone-100 text-stone-900 shadow-[0_10px_20px_rgba(255,255,255,.05)]':'text-stone-500 hover:bg-stone-900 hover:text-stone-200')},
          h('span',{className:props.tab===t.id?'text-stone-900':'text-stone-600'},t.icon),
          h('span',{className:'font-bold text-[13px] uppercase tracking-widest'},t.label)
        );})
      )
    ),
    // Main
    h('main',{className:'flex-1 flex flex-col overflow-hidden'},
      h('header',{className:'h-16 md:h-20 bg-white/80 backdrop-blur-md border-b border-stone-200 flex items-center justify-between px-4 md:px-10 sticky top-0 z-40'},
        h('div',{className:'flex items-center gap-4'},
          h('button',{onClick:function(){setSidebar(true);},className:'lg:hidden p-2 text-stone-900'},h(Ic.Menu)),
          h('h2',{className:'text-lg md:text-2xl font-bold text-stone-800 font-serif lowercase'},
            h('span',{className:'text-stone-300 mr-2 font-sans text-sm font-black uppercase tracking-widest'},'/'),props.tab
          )
        )
      ),
      h('div',{className:'flex-1 overflow-y-auto custom-scrollbar p-4 md:p-10'},props.children),
      // Bottom Nav Mobile
      h('nav',{className:'lg:hidden h-20 bg-white border-t border-stone-200 px-6 flex items-center justify-between sticky bottom-0 z-40 shadow-[0_-10px_25px_rgba(0,0,0,.05)]'},
        tabs.map(function(t){return h('button',{key:t.id,onClick:function(){props.setTab(t.id);},className:'flex flex-col items-center justify-center gap-1 transition-all '+(props.tab===t.id?'text-stone-900':'text-stone-400')},
          h('div',{className:'p-2 rounded-xl transition-all '+(props.tab===t.id?'bg-stone-900 text-white scale-110 shadow-lg':'')},t.icon),
          h('span',{className:'text-[8px] font-black uppercase '+(props.tab===t.id?'opacity-100':'opacity-0')},t.label)
        );})
      )
    ),
    sidebar?h('div',{onClick:function(){setSidebar(false);},className:'fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-40 lg:hidden'}):null
  );
}

// ==================== APP ====================
function App(){
  var ref1=useState('dashboard');var tab=ref1[0];var setTab=ref1[1];
  var content = null;
  if(tab==='dashboard') content = h(DashboardPage);
  else if(tab==='crm') content = h(CRMPage);
  else if(tab==='projects') content = h(ProjectsPage);
  else if(tab==='finance') content = h(FinancePage);
  else content = h(DashboardPage);

  return h(Layout,{tab:tab,setTab:setTab},content);
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
